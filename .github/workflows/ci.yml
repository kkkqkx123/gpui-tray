name: CI
on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref_name }}
  cancel-in-progress: true

env:
  # Debug info is most of a build's disk footprint and a large share of its
  # link time, and nothing in CI reads it.
  CARGO_PROFILE_DEV_DEBUG: 0

jobs:
  checks:
    name: Checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: The published GPUI Kit pins the same GPUI snapshot
        run: python3 script/check-gpui-kit-pin.py
      - uses: crate-ci/typos@v1.40.0

  lint:
    name: Lint
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: windows-latest
            target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        # `$TEST_EXCLUDES` must word-split, which PowerShell does not do.
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          components: clippy
          cache-save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Lint
        run: cargo clippy -p gpui-tray --all-targets -- --deny warnings
      - name: Test
        run: cargo test -p gpui-tray

  flavors:
    name: GPUI Fast flavor
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          components: clippy
          cache-save-if: ${{ github.ref == 'refs/heads/main' }}
      # The flavor selects the GPUI the application builds against. It is a
      # separate compile because the two backends are different crates.
      - name: Lint the GPUI Fast flavor
        run: cargo clippy -p gpui-tray --all-targets --no-default-features --features gpui-fast -- --deny warnings

  example:
    name: Example
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          cache-save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Install system dependencies
        run: script/install-linux.sh
      # The example builds against the published GPUI Kit, so it proves the
      # crate and the release resolve one GPUI snapshot.
      - name: Check the example
        run: cargo check -p tray_demo
